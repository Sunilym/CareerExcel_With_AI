<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AscendDev · C++ & AI Agents Growth Planner</title>
  <meta name="description" content="A personal plan and execution cockpit to master C++ and AI Agent development, with an integrated Gemini AI mentor." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-logo">🚀</span>
        <div class="brand-text">
          <strong>AscendDev</strong>
          <small>C++ · AI Agents</small>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>📊</span> Dashboard</button>
        <button class="nav-item" data-view="roadmap"><span>🗺️</span> Roadmap</button>
        <button class="nav-item" data-view="tasks"><span>✅</span> Tasks</button>
        <button class="nav-item" data-view="agent"><span>🤖</span> AI Mentor</button>
        <button class="nav-item" data-view="settings"><span>⚙️</span> Settings</button>
      </nav>
      <div class="sidebar-footer">
        <button id="themeToggle" class="ghost-btn" title="Toggle theme">🌙 Theme</button>
        <small class="muted">Data saved in your browser</small>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
        <h1 id="viewTitle">Dashboard</h1>
        <div class="topbar-actions">
          <span id="apiStatus" class="pill pill-warn" title="Gemini API key status">🔑 No API key</span>
        </div>
      </header>

      <section class="content" id="content"><!-- views injected here --></section>
    </main>
  </div>

  <!-- Task modal -->
  <div class="modal-backdrop" id="taskModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
      <div class="modal-head">
        <h3 id="taskModalTitle">New Task</h3>
        <button class="icon-btn" data-close-modal>✕</button>
      </div>
      <form id="taskForm" class="modal-body">
        <input type="hidden" id="taskId" />
        <label>Title
          <input type="text" id="taskTitle" required placeholder="e.g. Implement a lock-free queue in C++" />
        </label>
        <label>Details
          <textarea id="taskNotes" rows="3" placeholder="What does 'done' look like?"></textarea>
        </label>
        <div class="form-row">
          <label>Track
            <select id="taskTrack">
              <option value="cpp">C++</option>
              <option value="ai">AI Agents</option>
              <option value="general">General</option>
            </select>
          </label>
          <label>Priority
            <select id="taskPriority">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </label>
        </div>
        <div class="form-row">
          <label>Status
            <select id="taskStatus">
              <option value="todo">To Do</option>
              <option value="doing">In Progress</option>
              <option value="done">Done</option>
            </select>
          </label>
          <label>Deadline
            <input type="date" id="taskDeadline" />
          </label>
        </div>
        <div class="links-editor">
          <span class="links-label">Links</span>
          <div id="taskLinks" class="link-inputs"></div>
          <button type="button" class="ghost-btn small-btn" id="addLinkRow">＋ Add link</button>
        </div>
        <div class="modal-actions">
          <button type="button" class="ghost-btn" data-close-modal>Cancel</button>
          <button type="submit" class="primary-btn">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tool modal -->
  <div class="modal-backdrop" id="toolModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="toolModalTitle">
      <div class="modal-head">
        <h3 id="toolModalTitle">New Tool</h3>
        <button class="icon-btn" data-close-modal>✕</button>
      </div>
      <form id="toolForm" class="modal-body">
        <input type="hidden" id="toolId" />
        <label>Tool name
          <input type="text" id="toolName" required placeholder="e.g. Code Reviewer" />
        </label>
        <label>Instruction (how the mentor should behave when this tool is ON)
          <textarea id="toolInstruction" rows="4" required placeholder="e.g. Always review C++ for undefined behavior, RAII, and give Big-O analysis."></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="ghost-btn" data-close-modal>Cancel</button>
          <button type="submit" class="primary-btn">Save Tool</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/agent.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
